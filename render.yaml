services:
  - type: web
    name: premium-license-server
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: ADMIN_ORIGIN
        value: http://localhost:5173
      - key: ADMIN_SETUP_SECRET
        generateValue: true

